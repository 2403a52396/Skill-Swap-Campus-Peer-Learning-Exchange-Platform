<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Explore skills | Skill Swap Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-private="true"><div id="site-header"></div><main class="app-main"><div class="container">
  <section class="page-heading"><div><span class="eyebrow">Find your next exchange</span><h1>Explore skills</h1><p>Find a campus peer who can help you learn something new.</p></div><a class="button button-primary" href="post-skill.html"><i class="fa-solid fa-plus"></i> Share a skill</a></section>
  <section class="search-panel"><label class="search-input" for="skill-search"><i class="fa-solid fa-magnifying-glass"></i><input id="skill-search" type="search" placeholder="Search skills, students or topics..."></label><label class="filter-select"><span>Category</span><select id="category-filter"><option value="">All categories</option><option>Programming</option><option>Design</option><option>Communication</option><option>Business</option><option>Languages</option><option>Other</option></select></label><label class="filter-select"><span>Level</span><select id="level-filter"><option value="">All levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label></section>
  <div class="results-heading"><p id="results-count" aria-live="polite"></p><a class="text-link" href="explore.html">Clear filters</a></div><section id="skill-results" class="skill-grid" aria-live="polite"></section>
</div></main>
<dialog id="request-dialog" class="request-dialog"><form id="request-form" method="dialog"><button class="dialog-close" type="button" aria-label="Close dialog" data-close-dialog><i class="fa-solid fa-xmark"></i></button><span class="eyebrow">Start an exchange</span><h2>Send a skill request</h2><p id="request-skill-name" class="muted"></p><input type="hidden" name="skillId"><label for="offeredSkill">What can you offer in exchange?</label><input id="offeredSkill" name="offeredSkill" maxlength="100" required placeholder="e.g. I can help with Excel"><small>Choose something you can teach or a skill you bring to the exchange.</small><div class="dialog-actions"><button class="button button-outline" type="button" data-close-dialog>Cancel</button><button class="button button-primary" type="submit">Send request <i class="fa-regular fa-paper-plane"></i></button></div></form></dialog>
<div id="site-footer"></div><script src="js/app.js"></script><script src="js/explore.js"></script></body>
</html>
