<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My profile | Skill Swap Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-private="true"><div id="site-header"></div><main class="app-main"><div class="container profile-layout">
  <section class="profile-summary"><div class="profile-avatar" id="profile-avatar">SS</div><span class="eyebrow">Student profile</span><h1 id="profile-name">Student</h1><p id="profile-department">Department</p><div class="profile-meta"><span><i class="fa-regular fa-envelope"></i> <span id="profile-email"></span></span><span><i class="fa-solid fa-graduation-cap"></i> <span id="profile-year"></span></span></div><div class="profile-info-box"><strong>Your student ID</strong><span id="profile-student-id"></span><small>Only stored in this browser prototype.</small></div></section>
  <section class="profile-edit-card"><span class="eyebrow">Keep it up to date</span><h2>Edit your profile</h2><div id="profile-message" class="form-message" role="status" aria-live="polite"></div><form id="profile-form" novalidate><div class="form-grid"><div class="field"><label for="editName">Full name</label><input id="editName" name="fullName" maxlength="70" required></div><div class="field"><label for="editDepartment">Department</label><select id="editDepartment" name="department" required><option>Computer Science</option><option>Business Administration</option><option>Design & Media</option><option>Engineering</option><option>Arts & Humanities</option><option>Science</option><option>Other</option></select></div><div class="field"><label for="editYear">Year of study</label><select id="editYear" name="year" required><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>Postgraduate</option></select></div><div class="field"><label for="editStudentId">Student ID</label><input id="editStudentId" name="studentId" maxlength="40" required></div><div class="field field-wide"><label for="editTeach">Skills I can teach</label><input id="editTeach" name="skillsTeach" maxlength="240" required><small>Separate skills with commas.</small></div><div class="field field-wide"><label for="editWant">Skills I want to learn</label><input id="editWant" name="skillsWant" maxlength="240" required><small>Separate skills with commas.</small></div><div class="field-wide"><button class="button button-primary" type="submit">Save changes <i class="fa-solid fa-check"></i></button></div></div></form></section>
  <section class="profile-lower"><div class="profile-list-card"><span class="eyebrow">Your contribution</span><h2>Skills offered</h2><div id="profile-skills"></div></div><div class="profile-list-card"><span class="eyebrow">Milestones</span><h2>Completed exchanges</h2><div id="completed-exchanges"></div></div></section>
</div></main><div id="site-footer"></div><script src="js/app.js"></script><script src="js/profile.js"></script></body>
</html>
