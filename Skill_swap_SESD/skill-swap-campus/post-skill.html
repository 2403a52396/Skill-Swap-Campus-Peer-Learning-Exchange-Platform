<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Share a skill | Skill Swap Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-private="true"><div id="site-header"></div><main class="app-main"><div class="container narrow-container">
  <section class="page-heading"><div><span class="eyebrow">Give knowledge, get knowledge</span><h1 id="skill-form-title">Share a skill</h1><p>Help another student grow by offering something you know.</p></div></section>
  <div class="editor-card"><div id="skill-message" class="form-message" role="status" aria-live="polite"></div><form id="skill-form" novalidate><input type="hidden" name="skillId"><div class="form-grid"><div class="field field-wide"><label for="skillTitle">Skill title</label><input id="skillTitle" name="title" maxlength="80" required placeholder="e.g. Intro to Python programming"></div><div class="field"><label for="skillCategory">Category</label><select id="skillCategory" name="category" required><option value="">Choose category</option><option>Programming</option><option>Design</option><option>Communication</option><option>Business</option><option>Languages</option><option>Other</option></select></div><div class="field"><label for="skillLevel">Experience level</label><select id="skillLevel" name="level" required><option value="">Choose level</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="field field-wide"><label for="skillDescription">Description</label><textarea id="skillDescription" name="description" rows="4" maxlength="700" required placeholder="What will a student learn? What experience do you bring?"></textarea></div><div class="field"><label for="learningMode">Preferred learning mode</label><select id="learningMode" name="mode" required><option value="">Choose a mode</option><option>Online</option><option>Offline</option><option>Either</option></select></div><div class="field"><label for="availableDays">Available days</label><input id="availableDays" name="days" maxlength="100" required placeholder="e.g. Weekends, Tue/Thu"></div><div class="field"><label for="availableTime">Available time</label><input id="availableTime" name="time" maxlength="100" required placeholder="e.g. After 4 PM"></div><div class="field"><label for="exchangeSkill">Skills wanted in exchange</label><input id="exchangeSkill" name="exchangeSkill" maxlength="120" required placeholder="e.g. Excel, Spanish"></div><div class="field-wide editor-actions"><a class="button button-outline" href="explore.html">Cancel</a><button id="skill-submit" class="button button-primary" type="submit">Publish skill <i class="fa-solid fa-arrow-right"></i></button></div></div></form></div>
  <section class="my-skills-section"><div class="section-title-row"><div><span class="eyebrow">Your offers</span><h2>Manage your skill posts</h2></div></div><div id="my-skills-list" class="owned-skills-list"></div></section>
</div></main><div id="site-footer"></div><script src="js/app.js"></script><script src="js/skills.js"></script></body>
</html>
